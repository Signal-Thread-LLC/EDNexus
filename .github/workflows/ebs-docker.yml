name: EBS container

# Builds the Twitch Extension Backend Service image and publishes it to GitHub Container Registry,
# ready to deploy at https://ednexus.signal-and-thread.com.
#
# Pull requests build the image but do not push it, so a change to the Dockerfile or the service is
# proven to build before it merges without publishing from an unreviewed branch.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/EDNexus.Ebs/**'
      - '.github/workflows/ebs-docker.yml'
  pull_request:
    paths:
      - 'src/EDNexus.Ebs/**'
      - '.github/workflows/ebs-docker.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ednexus-ebs

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The EBS is deployed on its own, so its tests gate the image rather than the whole solution's.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test the service
        run: dotnet test tests/EDNexus.Ebs.Tests/EDNexus.Ebs.Tests.csproj --configuration Release

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/EDNexus.Ebs/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A container that cannot start is worse than a failed build, and the service validates its
      # configuration at startup — so prove it comes up before the image is called good.
      - name: Smoke test the image
        run: |
          docker build -f src/EDNexus.Ebs/Dockerfile -t ebs-smoke .
          docker run -d --name ebs-smoke -p 8787:8787 \
            -e Twitch__ClientId=smoke \
            -e Twitch__ExtensionId=smoke \
            -e Twitch__ClientSecret=smoke \
            -e Twitch__ExtensionSecret="$(printf 'smoke-test-extension-secret-0000' | base64 -w0)" \
            -e ASPNETCORE_URLS=http://0.0.0.0:8787 \
            ebs-smoke
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8787/healthz; then echo " — healthy"; exit 0; fi
            sleep 2
          done
          echo "The service never became healthy. Container log:"
          docker logs ebs-smoke
          exit 1

      - name: Container log on failure
        if: failure()
        run: docker logs ebs-smoke || true
